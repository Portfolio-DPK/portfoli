<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="avatar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with glow -->
  <rect width="400" height="400" rx="200" fill="url(#bg-grad)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#avatar-glow)" stroke-width="4" stroke-dasharray="10 8" opacity="0.8" />
  <circle cx="200" cy="200" r="150" fill="#6366f1" opacity="0.15" filter="url(#glow-blur)" />

  <!-- Code symbols background decoration -->
  <text x="60" y="100" font-family="monospace" font-size="22" fill="#818cf8" opacity="0.4">&lt;dev/&gt;</text>
  <text x="290" y="130" font-family="monospace" font-size="20" fill="#06b6d4" opacity="0.4">{ UI/UX }</text>
  <text x="70" y="310" font-family="monospace" font-size="18" fill="#a78bfa" opacity="0.3">const eka;</text>
  <text x="280" y="300" font-family="monospace" font-size="22" fill="#38bdf8" opacity="0.4">🚀</text>

  <!-- Body / Hoodie -->
  <path d="M120 380 C120 290 140 260 200 260 C260 260 280 290 280 380 Z" fill="url(#hoodie-grad)" />
  <!-- Inner hoodie collar -->
  <path d="M165 260 C180 285 220 285 235 260 C220 305 180 305 165 260 Z" fill="#1e1b4b" opacity="0.8" />

  <!-- Neck -->
  <rect x="185" y="225" width="30" height="45" rx="10" fill="#f59e0b" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#fbbf24" />

  <!-- Hair Modern Style -->
  <path d="M140 170 C135 120 170 100 215 105 C250 110 265 130 260 165 C245 140 220 135 185 140 C165 145 150 155 140 170 Z" fill="#1e1b4b" />
  <path d="M142 165 C138 135 160 115 190 110 C230 105 255 125 255 155 C240 135 210 130 180 135 C160 140 148 150 142 165 Z" fill="#312e81" />

  <!-- Glasses -->
  <rect x="160" y="165" width="32" height="24" rx="8" fill="none" stroke="#e0e7ff" stroke-width="4" />
  <rect x="208" y="165" width="32" height="24" rx="8" fill="none" stroke="#e0e7ff" stroke-width="4" />
  <line x1="192" y1="175" x2="208" y2="175" stroke="#e0e7ff" stroke-width="4" />

  <!-- Eyes behind glasses -->
  <circle cx="176" cy="177" r="4" fill="#1e1b4b" />
  <circle cx="224" cy="177" r="4" fill="#1e1b4b" />
  <circle cx="178" cy="175" r="1.5" fill="#ffffff" />
  <circle cx="226" cy="175" r="1.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M162 156 Q176 150 190 156" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
  <path d="M210 156 Q224 150 238 156" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M185 215 Q200 228 215 215" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round" />

  <!-- Tech Badge Overlay at bottom right -->
  <g transform="translate(270, 270)">
    <circle cx="25" cy="25" r="28" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
    <path d="M18 25 L23 30 L32 20" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
